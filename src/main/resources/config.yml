# Database configuration
# Any changes require server restart to take an effect.
database:
  # Host of your db
  host: 'localhost'
  # Default is 3306, don't touch it if you didn't change it in your db configuration
  port: '3306'
  # Default: 6
  max-connections: 6
  # Name of database
  name: 'dbname'
  # Login to db account
  login: 'user'
  # Password to db account
  password: 'password'

# Text to append after currency amount when formatting it.
# E.g. 420k, 6M, 9B etc.
currency-formatting:
  thousands: 'k'
  millions: 'M'
  billions: 'B'